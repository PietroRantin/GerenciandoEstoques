{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block public %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="text-center my-4">
      <div class="logo-login"><i class="bi bi-box2-heart"></i></div>
      <h1 class="h3 fw-bold">Estoque Fácil</h1>
      <p class="text-muted">Controle simples de estoque para o seu comércio</p>
    </div>
    <div class="card shadow-sm"><div class="card-body p-4">
      <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="email">E-mail</label>
          <input class="form-control form-control-lg" type="email" id="email" name="email" value="{{ email }}" required autofocus autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label" for="senha">Senha</label>
          <input class="form-control form-control-lg" type="password" id="senha" name="senha" required autocomplete="current-password">
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="lembrar" name="lembrar">
          <label class="form-check-label" for="lembrar">Manter conectado neste aparelho</label>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
      </form>
    </div></div>
    <p class="text-center small text-muted mt-3">Esqueceu a senha? Peça ao administrador do sistema para redefini-la.</p>
  </div>
</div>
{% endblock %}
